  .badge{
    position: absolute;
    transform: translate(-50%, -50%) translateX(-60px) scale(0.9);
    opacity: 0;
    padding: clamp(4px, 1.1vw, 6px) clamp(10px, 2.6vw, 15px);
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(8px, 2vw, 11px);
    letter-spacing: 0.2px;
    color: #1e1e1e;
    white-space: nowrap;
    background: var(--badge-fill);
    box-shadow:
      inset 3px 3px 8px 0 var(--badge-inner-shadow),
      inset -2px -2px 6px 0 rgba(255,255,255,0.35),
      0 4px 10px rgba(0,0,0,0.25);
    cursor: default;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease;
  }

  .portrait-frame.in-view .badge{
    transform: translate(-50%, -50%) translateX(0) scale(1);
    opacity: 1;
  }

  .portrait-frame.in-view .badge:hover{
    transform: translate(-50%, -50%) translateX(0) scale(1.12);
    z-index: 10;
  }

</head>
<body>

<div class="portrait-wrap">
  <div class="portrait-frame" id="portraitFrame">
    <div class="badge" data-badge style="left:33%; top:10%; --badge-fill:rgba(223,201,255,0.7); --badge-inner-shadow:rgba(94,24,191,0.3); transition-delay:0ms;">« FEMME NOIRE »</div>
    <div class="badge" data-badge style="left:68%; top:27%; --badge-fill:rgba(218,255,201,0.7); --badge-inner-shadow:rgba(64,159,20,0.3); transition-delay:160ms;">« IMMIGRANTE ALGÉRIENNE »</div>
    <div class="badge" data-badge style="left:19%; top:43%; --badge-fill:rgba(218,255,201,0.7); --badge-inner-shadow:rgba(64,159,20,0.3); transition-delay:320ms;">« NIGÉRIANE »</div>
    <div class="badge" data-badge style="left:39%; top:59%; --badge-fill:rgba(218,255,201,0.7); --badge-inner-shadow:rgba(64,159,20,0.3); transition-delay:480ms;">« GUINÉENNE »</div>
    <div class="badge" data-badge style="left:70%; top:81%; --badge-fill:rgba(255,226,201,0.7); --badge-inner-shadow:rgba(191,102,24,0.3); transition-delay:640ms;">« MÉTISSE »</div>
  </div>
</div>

<script>
(function(){
  const frame = document.getElementById('portraitFrame');
  const badgeEls = frame.querySelectorAll('[data-badge]');

  // Set border-radius proportional to each badge's rendered height,
  // matching the reference ratio: 6px radius for a 19px-tall badge.
  function applyProportionalRadius(){
    badgeEls.forEach(function(el){
      const h = el.offsetHeight;
      if (h > 0){
        el.style.borderRadius = (h * 6 / 19) + 'px';
      }
    });
  }

  // Run once badges have their natural size (before the reveal transform kicks in),
  // and again after any resize.
  requestAnimationFrame(applyProportionalRadius);
  window.addEventListener('resize', applyProportionalRadius);

  const observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting){
        frame.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.35 });
  observer.observe(frame);
})();
</script>

</body>
